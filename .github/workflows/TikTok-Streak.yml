name: TikTok Streak

on:
  schedule:
    - cron: "0 2 * * *"   # 09:00 WIB (UTC+7)
  workflow_dispatch:
    inputs:
      custom_message:
        description: 'Custom message (kosongkan = pakai default)'
        required: false
        type: string
      scan_only:
        description: 'Scan only (tanpa kirim pesan)'
        required: false
        type: boolean
        default: false

jobs:
  streak:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Puppeteer browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ hashFiles('package-lock.json') }}

      - run: npm install

      - name: Run TikTok Streak
        env:
          COOKIES_JSON: ${{ secrets.COOKIES_JSON }}
          CUSTOM_MESSAGE: "api api api @daoabot"
          SCAN_ONLY: ""
        run: node index.js --debug 2>&1 | tee streak-output.log

      - name: Upload debug HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: |
            debug-*.html
            streak-output.log
          if-no-files-found: ignore

      - name: Discord Notification
        if: always()
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          username: TikTok Streak
          content: |
            **TikTok Streak**
            Status: `${{ job.status }}`
            Repository: `${{ github.repository }}`
            Trigger: `${{ github.event_name }}`
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
